<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Payment Form</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->

    <style>
        body {
            background-color: antiquewhite;
        }

        #form {
            width: 50%;
            margin: auto;
            margin-top: 100px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.7);
        }

        #form input {
            height: 2rem;
        }

        #form select {
            height: 2rem;
        }

        #form img {
            height: 2rem;

    </style>
</head>

<body>
    <div class="container-fluid">
        <form action="submit.html" method="GET" class="bg-light p-4 rounded-5" id="form">
            <div class="row">
                <div class="col">
                    <h3 class="text-danger">Billing Address</h3>
                    <label for="fname" class="form-label">Full Name</label><br>
                    <input type="text" id="fname" name="fname" placeholder="Enter Your Full Name" class="w-100" /><br>
                    <label for="email" class="form-label">Email:</label><br>
                    <input type="email" id="email" name="email" placeholder="Enter Email Address" class="w-100" /><br>
                    <label for="address" class="form-label">Address:</label><br>
                    <input type="text" id="address" name="address" placeholder="Enter Address" class="w-100" /><br>
                    <label for="city" class="form-label">City:</label><br>
                    <input type="text" id="city" name="city" placeholder="Enter City" class="w-100" /><br>
                    <div class="row">
                        <div class="col">
                            <label for="state" class="form-label">State:</label><br>
                            <input type="text" id="state" name="state" placeholder="Enter State" class="w-100" /><br>
                        </div>
                        <div class="col">
                            <label for="zipcode" class="form-label">Zip Code:</label><br>
                            <input type="text" id="zipcode" name="zipcode" placeholder="123 456" class="w-100" /><br>
                        </div>
                    </div>
                </div>

                    <h3 class="text-danger">Payment</h3>
                    <label for="" class="form-label">Card Accepted:</label><br>

                    <img src="https://img.icons8.com/color/48/000000/mastercard-logo.png" />
                    <img src="https://img.icons8.com/color/48/000000/discover.png" />
                    <img src="https://img.icons8.com/color/48/000000/visa.png" /><br>
                    <label for="cardname" class="form-label">Name On Card:</label><br>
                    <input type="text" id="cardname" name="cardname" placeholder="Enter card name" class="w-100" /><br>
                    <label for="credit" class="form-label">Credit Card Number:</label><br>
                    <input type="text" id="credit" name="credit" placeholder="1111-2222-3333-4444" class="w-100" /><br>
                    <label for="expm" class="form-label">Exp Month:</label><br>
                    <select name="expm" id="expm" class="w-100" required>
                        <option value="">Choose Month</option>
                        <option value="1">Month 1</option>
                        <option value="2">Month 2</option>
                        <option value="3">Month 3</option>
